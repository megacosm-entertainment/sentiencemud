[formats]
text_format = "%d(%Y-%m-%d %H:%M:%S.%us) %-6V (%c) - %m%n"
bug_format = "%d(%Y-%m-%d %H:%M:%S.%us) %-6V (%c:%F:%L %U) - %m%n"
debug_format = "%d(%Y-%m-%d %H:%M:%S.%us) %-6V (%c:%F:%L %U) - %m%n"
unit_test_format = "%m%n"

[rules]
# Console output for key categories
info.* >stdout; text_format
unit_tests.* >stdout; unit_test_format

# Central system log (all messages info and above, rotated at 10MB)
*.info "logs/system.log" rotate 10M; text_format
*.=debug "logs/system.log" rotate 10M; debug_format
*.=warn "logs/system.log" rotate 10M; debug_format
*.=error "logs/system.log" rotate 10M; debug_format
*.=bug "logs/system.log" rotate 10M; bug_format

# Dedicated unit test log with clean format
unit_tests.* "logs/unit_tests.log" rotate 10M; unit_test_format