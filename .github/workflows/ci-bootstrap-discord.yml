name: CI Bootstrap Discord Results

on:
  workflow_run:
    workflows:
      - CI Bootstrap Tests
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify Discord with CI result
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.GHA_CI_TESTS_DISCORD_WEBHOOK }}

    steps:
      - name: Build CI result payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run) {
              core.setOutput('skip', 'true');
              return;
            }

            const eventName = run.event;
            const isRelevant = ['pull_request', 'push', 'merge_group', 'workflow_dispatch'].includes(eventName);
            if (!isRelevant) {
              core.setOutput('skip', 'true');
              return;
            }

            const conclusion = run.conclusion || 'unknown';
            const status = run.status || 'completed';
            const branch = run.head_branch || '(unknown)';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const actor = run.actor?.login || context.actor;

            const success = conclusion === 'success';
            const color = success ? 3066993 : 15158332;
            const icon = success ? '✅' : '❌';
            const title = `${icon} CI Bootstrap Tests ${success ? 'Passed' : 'Failed'}`;

            const prText = (run.pull_requests && run.pull_requests.length > 0)
              ? `\n**PR:** #${run.pull_requests[0].number}`
              : '';

            const description = [
              `**Repository:** ${repo}`,
              `**Branch:** ${branch}`,
              `**Event:** ${eventName}`,
              `**Conclusion:** ${conclusion}`,
              `**Triggered by:** ${actor}${prText}`
            ].join('\n');

            const body = {
              content: null,
              embeds: [
                {
                  title,
                  description,
                  url: run.html_url,
                  color,
                  timestamp: new Date().toISOString(),
                  fields: [
                    {
                      name: 'Workflow',
                      value: run.name || 'CI Bootstrap Tests',
                      inline: true
                    },
                    {
                      name: 'Run ID',
                      value: `${run.id}`,
                      inline: true
                    },
                    {
                      name: 'Status',
                      value: status,
                      inline: true
                    }
                  ]
                }
              ]
            };

            core.setOutput('skip', 'false');
            core.setOutput('json', JSON.stringify(body));

      - name: Send CI result to Discord
        if: steps.payload.outputs.skip != 'true' && env.DISCORD_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ env.DISCORD_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.payload.outputs.json }}
        run: |
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"
