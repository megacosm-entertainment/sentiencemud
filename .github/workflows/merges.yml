name: Merge Notifications

on:
  push:
    branches:
      - master
      - v2_testport
      - legacy_server
      - legacy_testport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-discord:
    name: Notify Discord on merge/direct push
    runs-on: ubuntu-latest

    steps:
      - name: Build notification payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const headCommit = context.payload.head_commit || {};
            const message = headCommit.message || '(no commit message)';
            const author = (headCommit.author && headCommit.author.name) || context.actor;
            const commitUrl = headCommit.url || `${context.payload.repository.html_url}/commit/${context.sha}`;
            const branch = context.ref.replace('refs/heads/', '');
            const isMerge = /^Merge\s/i.test(message) || message.includes('Merge pull request');

            const title = isMerge ? 'Merge pushed' : 'Direct push';
            const color = isMerge ? 3066993 : 15158332;
            const description = [
              `**Repository:** ${context.repo.owner}/${context.repo.repo}`,
              `**Branch:** ${branch}`,
              `**Author:** ${author}`,
              `**Message:** ${message.split('\n')[0]}`
            ].join('\n');

            const body = {
              content: null,
              embeds: [
                {
                  title,
                  description,
                  url: commitUrl,
                  color,
                  timestamp: new Date().toISOString()
                }
              ]
            };

            core.setOutput('json', JSON.stringify(body));

      - name: Select webhook
        id: webhook
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == "legacy_server" && -n "${{ secrets.GHA_LEGACY_DISCORD_WEBHOOK }}" ]]; then
            echo "url=${{ secrets.GHA_LEGACY_DISCORD_WEBHOOK }}" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "v2_testport" && -n "${{ secrets.GHA_20_DISCORD_WEBHOOK }}" ]]; then
            echo "url=${{ secrets.GHA_20_DISCORD_WEBHOOK }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ secrets.GHA_MERGES_DISCORD_WEBHOOK }}" ]]; then
            echo "url=${{ secrets.GHA_MERGES_DISCORD_WEBHOOK }}" >> "$GITHUB_OUTPUT"
          else
            echo "No merge webhook secret configured for branch '$BRANCH'; skipping notification."
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        if: steps.webhook.outputs.url != ''
        env:
          WEBHOOK_URL: ${{ steps.webhook.outputs.url }}
          PAYLOAD: ${{ steps.payload.outputs.json }}
        run: |
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"
